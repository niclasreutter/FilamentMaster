[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["custom_components/filament_manager/www"]

[tool.ruff.lint]
select = [
  "A",    # builtins shadowing
  "ASYNC",
  "B",    # bugbear
  "C4",
  "D",    # docstrings
  "E",
  "F",
  "I",    # import order
  "ICN",
  "INP",
  "ISC",
  "N",
  "PGH",
  "PIE",
  "PL",
  "PTH",
  "RET",
  "RUF",
  "SIM",
  "SLF",
  "T20",
  "TID",
  "TRY",
  "UP",
  "W",
]
ignore = [
  "D203",    # conflicts with D211
  "D213",    # conflicts with D212
  "PLR0912", # the options flow legitimately branches a lot
  "PLR0913",
  "PLR0915",
  "PLR2004",
  "TRY003",  # short, specific messages beat a wall of exception classes
  "TRY400",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "SLF", "PLR2004", "INP001"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "tests"]
force-sort-within-sections = true
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--disable-socket --allow-unix-socket"
